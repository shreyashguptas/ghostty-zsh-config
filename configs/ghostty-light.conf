# Ghostty Configuration - Light Mode
# Syntax note: Ghostty uses `key = value`, one setting per line.
# Trailing `#` comments on a value line are NOT supported — the comment
# would be parsed as part of the value. Keep comments on their own lines.

# ===== APPEARANCE =====
# Font configuration
# Family name as macOS reports it (verify with: ghostty +list-fonts)
font-family = JetBrainsMono Nerd Font Mono
font-size = 14

# Colors - Light Mode (GitHub Light)
background = #ffffff
foreground = #24292f
cursor-color = #0969da
cursor-text = #ffffff

# Base colors (0-7)
# 0 light gray, 1 red, 2 green, 3 yellow, 4 blue, 5 magenta, 6 cyan, 7 dark gray
palette = 0=#f6f8fa
palette = 1=#d1242f
palette = 2=#1a7f37
palette = 3=#9a6700
palette = 4=#0969da
palette = 5=#8250df
palette = 6=#0550ae
palette = 7=#24292f

# Bright colors (8-15)
palette = 8=#8c959f
palette = 9=#b31d28
palette = 10=#1f883d
palette = 11=#bf8700
palette = 12=#2188ff
palette = 13=#a475f9
palette = 14=#3192aa
palette = 15=#1f2328

# ===== BEHAVIOR =====
# This is the real setting behind this repo's "multi-line paste" section.
# The old `paste-multiline-mode` / `paste-multiline-delay` keys never existed.
#
# Left ON (the Ghostty default) because it only prompts for genuinely unsafe
# pastes — text with a trailing newline, which would auto-execute. Ordinary
# multi-line pastes go through silently via bracketed paste, so the annoyance
# this repo originally set out to fix is already gone.
#
# If you still want zero prompts, set this to false and accept that pasted
# text ending in a newline will run immediately.
clipboard-paste-protection = true
# Strip trailing whitespace off copied selections
clipboard-trim-trailing-spaces = true

# Scrollback is measured in bytes, not lines (~10 MB)
scrollback-limit = 10000000
# Lines scrolled per notch of a discrete mouse wheel
mouse-scroll-multiplier = discrete:3

# ===== WINDOW =====
window-padding-x = 10
window-padding-y = 10
# Resize the window in whole cell steps rather than pixels
window-step-resize = true

# ===== URL HANDLING =====
# Make URLs clickable; they open in the default browser
link-url = true

# ===== NOTIFICATIONS =====
# Bounce the Dock icon, mark the title, and play the system alert
bell-features = system,attention,title

# ===== KEYBOARD SHORTCUTS =====
# Intentionally empty. cmd+c/v, cmd+n/t/w, cmd+shift+[ / ], and
# cmd+= / cmd+- / cmd+0 are already Ghostty defaults on macOS.
# To add your own:  keybind = cmd+shift+r=reload_config
